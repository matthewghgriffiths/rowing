# This workflow installs the package, lints with ruff and runs the test suite
# across the supported Python versions.
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Test package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install ruff
      run: python -m pip install ruff
    - name: Fail on real errors (syntax, undefined names)
      run: ruff check . --select E9,F63,F7,F82
    - name: Lint (advisory)
      run: ruff check .
      continue-on-error: true
    - name: Formatting (advisory)
      run: ruff format --check .
      continue-on-error: true

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install package with all extras
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e .[all,dev]
    - name: Test with pytest
      # Network tests are deselected by default (conftest skips them unless
      # --run-network is passed).
      run: pytest --cov=rowing --cov-report=term-missing

  network-test:
    # Live World Rowing API integration tests (request plumbing + the livetracker pipeline).
    # Run once, on the latest supported Python. Hits the live API, so it can be flaky if the
    # service is down -- relax to `continue-on-error: true` if that becomes a nuisance.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install package with all extras
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e .[all,dev]
    - name: Run live-API tests
      run: pytest -m network --run-network
